name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "25 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'change' }}
  cancel-in-progress: true

env:
  CI: "true"
  WRANGLER_SEND_METRICS: "false"

jobs:
  changes:
    name: Change scope
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, resurface]
    timeout-minutes: 3
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]] && ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE"
          fi
          node ci/scope.js >> "$GITHUB_OUTPUT"

  fast:
    name: Fast checks
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, resurface]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci && npm ci --prefix server && npm ci --prefix web && npm ci --prefix deploy/processor
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:fast
      - run: npm run build --prefix server

  required:
    name: CI required
    needs: [changes, fast]
    if: always()
    runs-on: [self-hosted, Linux, X64, resurface]
    timeout-minutes: 2
    env:
      FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      SCOPE: ${{ needs.changes.result }}
      CODE: ${{ needs.changes.outputs.code }}
      FAST: ${{ needs.fast.result }}
    steps:
      - run: |
          if [[ "$FORK" == true ]]; then
            echo "::error::Fork PRs are not run in CI. A maintainer must review it and re-run CI from a same-repo branch."
            exit 1
          fi
          [[ "$SCOPE" == success ]]
          [[ "$FAST" == success || ( "$CODE" == false && "$FAST" == skipped ) ]]

  journey:
    name: Journey and worker builds
    needs: [changes, fast]
    if: needs.changes.outputs.code == 'true' && needs.fast.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, resurface]
    timeout-minutes: 60
    concurrency:
      group: resurface-heavy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci && npm ci --prefix server && npm ci --prefix web && npm ci --prefix deploy/processor
      - name: Use job-local browser cache and evidence directory
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TOOL_CACHE/ms-playwright" >> "$GITHUB_ENV"
          echo "CI_EVIDENCE_DIR=$RUNNER_WORKSPACE/evidence/journey-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_WORKSPACE/evidence"
          find "$RUNNER_WORKSPACE/evidence" -mindepth 1 -maxdepth 1 -mtime +7 -exec rm -rf {} +
      - run: npx playwright install chromium
      - name: Require render tools (never silently skip integration tests)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          ffmpeg -version
          ffprobe -version
          test -x /usr/bin/chromium || test -x /usr/bin/google-chrome-stable
          test -f "$RENDER_FONT"
        env:
          RENDER_FONT: /usr/share/fonts/liberation/LiberationSans-Bold.ttf
      - name: Full server render integration (nightly or manual)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm test --prefix server
        env:
          RENDER_FONT: /usr/share/fonts/liberation/LiberationSans-Bold.ttf
      - run: npm run build
      - run: npm run test:journey
      - name: Report where the UI evidence is kept on the runner
        if: always()
        run: |
          echo "Synthetic-fixture UI evidence is kept on runner \`$RUNNER_NAME\` at \`$CI_EVIDENCE_DIR\` for 7 days." | tee -a "$GITHUB_STEP_SUMMARY"
          find "$CI_EVIDENCE_DIR" -type f -printf -- "- %P\n" 2>/dev/null | sort | tee -a "$GITHUB_STEP_SUMMARY" || true
