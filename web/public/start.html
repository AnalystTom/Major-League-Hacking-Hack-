<!doctype html>
<html lang="en" data-palette="hn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get started · Resurface</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      var ok = ["hn", "highlighter", "cobalt", "violet"], p = null;
      try { p = localStorage.getItem("resurface-palette"); } catch (e) {}
      if (ok.indexOf(p) >= 0) document.documentElement.dataset.palette = p;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400..800&family=Funnel+Sans:wght@400..700&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="onboard-page">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="wordmark" href="/" aria-label="Resurface home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10 9.5l4.5 2.5-4.5 2.5z"/></svg>
        Resurface
      </a>
    </div>
  </header>

  <main class="onboard" data-onboard>
    <p class="onboard-loading" data-loading>Loading…</p>

    <!-- Account: the only step. Signing up or in goes straight to /app. -->
    <section class="onboard-card" data-step="account" hidden aria-labelledby="account-title">
      <h1 id="account-title" data-account-title>Create your account</h1>
      <p class="onboard-lede" data-account-lede>Resurface turns the videos you saved into 30-second shorts. Sign up, then paste your links.</p>
      <form class="onboard-form" data-form="signup" novalidate>
        <label for="su-name">Name <span class="opt">(optional)</span></label>
        <input id="su-name" name="name" autocomplete="name" maxlength="80">
        <label for="su-email">Email</label>
        <input id="su-email" name="email" type="email" autocomplete="email" required>
        <label for="su-password">Password</label>
        <input id="su-password" name="password" type="password" autocomplete="new-password" minlength="10" required aria-describedby="su-password-hint">
        <p class="hint" id="su-password-hint">At least 10 characters.</p>
        <button class="btn" type="submit">Create account</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
      <form class="onboard-form" data-form="login" novalidate hidden>
        <label for="li-email">Email</label>
        <input id="li-email" name="email" type="email" autocomplete="email" required>
        <label for="li-password">Password</label>
        <input id="li-password" name="password" type="password" autocomplete="current-password" required>
        <button class="btn" type="submit">Sign in</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
      <p class="onboard-switch">
        <span data-switch-text>Already have an account?</span>
        <button type="button" class="linkish" data-switch>Sign in</button>
      </p>
    </section>

  </main>

  <script src="/start.js" type="module"></script>
</body>
</html>
